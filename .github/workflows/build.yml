name: Build StosDebug

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: List project
        run: |
          xcodebuild \
            -project StosDebug.xcodeproj \
            -list

      - name: Build
        run: |
          xcodebuild \
            -project StosDebug.xcodeproj \
            -scheme StosDebug \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -eux

          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/StosDebug.app"

          test -d "$APP_PATH"

          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/

          cd artifacts
          zip -r StosDebug.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StosDebug-IPA
          path: artifacts/StosDebug.ipa
          if-no-files-found: error
