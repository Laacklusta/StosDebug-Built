name: Build StosDebug

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS app
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -e

          xcodebuild \
            -project StosDebug.xcodeproj \
            -target StosDebug \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package app
        run: |
          set -e

          mkdir -p artifacts
          cp -R build/Build/Products/Release-iphoneos/StosDebug.app \
            artifacts/StosDebug.app

      - name: Create IPA
        run: |
          set -e

          mkdir -p artifacts/Payload
          cp -R artifacts/StosDebug.app artifacts/Payload/

          cd artifacts
          zip -r StosDebug.ipa Payload
          rm -rf Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StosDebug
          path: artifacts/StosDebug.ipa
          if-no-files-found: error
